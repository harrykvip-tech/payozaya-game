name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Capacitor Android project
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon.svg www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ပျော်စရာဂိမ်း" com.payozaya.game --web-dir www
          npx cap add android
          npm install --save-dev @capacitor/assets
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: payozaya-game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
